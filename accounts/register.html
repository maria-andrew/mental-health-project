{% extends "base.html" %}
{% block content %}

<h2>Patient Registration</h2>

<form method="post">
    {% csrf_token %}

    <label>Username</label>
    <input type="text" name="username" required class="form-control">

    <label>Password</label>
    <input type="password" name="password" required class="form-control">

    <label>Email</label>
    <input type="email" name="email" required class="form-control">

    <label>Phone Number</label>
    <input type="text" name="phone" required class="form-control">

    <label>Gender</label>
    <select name="gender" class="form-control" required>
        <option value="">Select</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <label>Occupation</label>
    <select name="occupation" class="form-control" required>
        <option value="">Select</option>
        <option value="student">Student</option>
        <option value="working">Working Professional</option>
        <option value="self">Self Employed</option>
        <option value="other">Other</option>
    </select>

    <label>Have you taken mental health medication before?</label>
    <select name="previous_medication" class="form-control">
        <option value="no">No</option>
        <option value="yes">Yes</option>
    </select>

    <label>If yes, mention diagnosis (optional)</label>
    <textarea name="previous_diagnosis" class="form-control"></textarea>

    <br>
    <button class="btn btn-primary">Register</button>
</form>

{% if error %}
<p style="color:red">{{ error }}</p>
{% endif %}

{% endblock %}
