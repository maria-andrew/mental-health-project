{% extends "base.html" %}
{% block content %}

<div class="container mt-4">
    <div class="card shadow-lg p-4">
        <h3 class="text-center mb-3">
            📊 Mental Health Progress
        </h3>

        <p class="text-muted text-center">
            Track how your depression score changes over time
        </p>

        <canvas id="progressChart" height="120"></canvas>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

{{ dates|json_script:"dates-data" }}
{{ scores|json_script:"scores-data" }}

<script>
const ctx = document.getElementById('progressChart');

if (ctx) {
    const dates = JSON.parse(
        document.getElementById('dates-data').textContent
    );
    const scores = JSON.parse(
        document.getElementById('scores-data').textContent
    );

    new Chart(ctx, {
        type: 'line',
        data: {
            labels: dates,
            datasets: [{
                label: 'Depression Score',
                data: scores,
                borderColor: '#2563eb',
                backgroundColor: 'rgba(37, 99, 235, 0.15)',
                borderWidth: 3,
                pointRadius: 5,
                pointBackgroundColor: '#2563eb',
                tension: 0.4,
                fill: true
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    display: true,
                    labels: {
                        font: { size: 14 }
                    }
                },
                tooltip: {
                    callbacks: {
                        label: function(context) {
                            return ` Score: ${context.raw}`;
                        }
                    }
                }
            },
            scales: {
                y: {
                    beginAtZero: true,
                    suggestedMax: 30,
                    title: {
                        display: true,
                        text: 'Depression Score'
                    }
                },
                x: {
                    title: {
                        display: true,
                        text: 'Date'
                    }
                }
            }
        }
    });
}
</script>

{% endblock %}
