{% extends "base.html" %}
{% block content %}

<h2>Book Appointment with {{ doctor.name }}</h2>

<form method="post">
    {% csrf_token %}
    <label>Date:</label>
    <input type="date" name="date" required><br><br>

    <label>Time:</label>
    <input type="time" name="time" required><br><br>

    <button type="submit">Book Appointment</button>
</form>

{% endblock %}
