<!DOCTYPE html>
<html>
<head>
    <title>Mental Health Portal</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .card {
            border-radius: 12px;
        }
        h3 {
            font-weight: 600;
        }
        canvas {
            margin-top: 20px;
        }
    </style>
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark px-3">
    <!-- Brand -->
    <a class="navbar-brand text-white"
       href="{% if user.is_authenticated and user.doctor_profile %}
                {% url 'doctor_dashboard' %}
             {% elif user.is_authenticated %}
                {% url 'dashboard' %}
             {% else %}
                /
             {% endif %}">
        Mental Health
    </a>

    <!-- Right buttons -->
    <div class="d-flex gap-2">

        {% if user.is_authenticated %}

            {% if user.doctor_profile %}
                <!-- Doctor -->
                <a href="{% url 'doctor_dashboard' %}"
                   class="btn btn-outline-light btn-sm">
                    🩺 Doctor Dashboard
                </a>

                <a href="{% url 'doctor_logout' %}"
                   class="btn btn-danger btn-sm">
                    🚪 Logout
                </a>

            {% else %}
                <!-- Patient -->
                <a href="{% url 'dashboard' %}"
                   class="btn btn-outline-light btn-sm">
                    🏠 Patient Dashboard
                </a>

                <a href="{% url 'logout' %}"
                   class="btn btn-danger btn-sm">
                    🚪 Logout
                </a>
            {% endif %}

        {% else %}
            <!-- Guest -->
            <a href="{% url 'login' %}"
               class="btn btn-outline-light btn-sm">
                Patient Login
            </a>

            <a href="{% url 'doctor_login' %}"
               class="btn btn-warning btn-sm">
                Doctor Login
            </a>
        {% endif %}

    </div>
</nav>

<div class="container mt-4">
    {% block content %}
    {% endblock %}
</div>

</body>
</html>
